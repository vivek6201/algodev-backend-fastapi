[project]
name = "backend"
version = "0.1.0"
description = "Algorithmic Dev Backend API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Vivek", email = "dev.vivekgupta@gmail.com" }
]
dependencies = [
    "fastapi[standard]",
    "pydantic",
    "sqlmodel",
    "pydantic-settings",
    "psycopg2-binary",
    "alembic",
    "python-jose",
    "bcrypt",
    "python-multipart",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | alembic
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]
exclude = [".venv", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
asyncio_mode = "auto"

[project.scripts]
start = "app.server:main"
dev = "app.server:dev"
